name: Paso 2 - Escaneo informativo
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: fluidattacks/sast-action@1.3.0
        id: sast
        with:
          scan_config_path: .github/fluid/sast-config.yaml
          scanner_mode: full
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fluidattacks/sca-action@1.2.0
        id: sca
        with:
          scan_config_path: .github/fluid/sca-config.yaml
          scanner_mode: full
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: fluidattacks/ss-action@0.3.0
        id: ss
        with:
          scan_config_path: .github/fluid/ss-config.yaml
          scanner_mode: full
